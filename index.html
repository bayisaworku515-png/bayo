<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mouse Events</title>
    <!-- Connect our CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>JavaScript Mouse Events Demo</h1>

        <!-- 1. Click & Double Click Buttons -->
        <section class="card">
            <h2>1. Click & Double Click</h2>
            <button id="myBtn" class="btn">Single Click Me</button>
            <button id="dblBtn" class="btn">Double Click Me</button>
            <p id="clickMessage">Status: Waiting for click...</p>
        </section>

        <!-- 2. Hover, MouseDown & MouseUp Box -->
        <section class="card">
            <h2>2. Mouse Enter, Leave, Down & Up</h2>
            <div id="box" class="interactive-box">
                Hover or Click inside me!
            </div>
        </section>

        <!-- 3. Mouse Move & Coordinates -->
        <section class="card">
            <h2>3. Mouse Movement Tracking</h2>
            <div id="trackerArea" class="tracker-box">
                Move your mouse inside this area!
            </div>
            <p id="coords">Coordinates: X: 0 | Y: 0</p>
        </section>

        <!-- 4. Right-Click (Context Menu) -->
        <section class="card">
            <h2>4. Custom Right-Click</h2>
            <div id="rightClickBox" class="interactive-box">
                Right-click inside this box!
            </div>
            <p id="rightClickMsg"></p>
        </section>
    </div>

    <!-- Connect our JavaScript file -->
    <script src="js/app.js"></script>
</body>
</html>
